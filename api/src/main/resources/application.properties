spring.application.name=pokemonmaster

spring.datasource.url=jdbc:postgresql://localhost:5432/pokemon_master_db
spring.datasource.username=pokemnon_master_user
# 本番では環境変数 DB_PASSWORD で渡す（実際のパスワードはコミットしない）
spring.datasource.password=${DB_PASSWORD:pokemnon_master_password}

# スキーマは手動管理。Entityとの不一致は起動時にエラーにする
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# 400等のエラーをRFC 9457形式で返す
spring.mvc.problemdetails.enabled=true